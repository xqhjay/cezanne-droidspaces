name: Build cezanne LXC/Droidspaces kernel

# 目标机型：Redmi K30 Ultra (cezanne / k6889v1_64) / MT6889 / 内核 4.14.186
#
# 源码选择（关键）：用 makingrom 的 MGF 内核（分支 r）。
#   它是社区在用的第三方内核，workflow 有多次成功记录，
#   说明「OSS 源码 + 原厂 defconfig」这条路本身能开机。
#   我先前用 MiCode OSS 原版 + 自己拼配置之所以卡第一屏，
#   是因为 GPU DDK 等版本与原厂不一致（原厂 r32p1，OSS 树只有到 r25p0）。
#
# 容器配置：套用 LXC-DOCKER-KernelSU_Action 的 LXC-DOCKER-OPEN-CONFIG.sh，
#   它把 SYSVIPC / POSIX_MQUEUE / IPC_NS / CGROUP* / OVERLAY_FS / MACVLAN 等
#   容器所需开关一次性写进 defconfig。
#   注意：该脚本清单里没有 CONFIG_SYSVIPC，而 IPC_NS 依赖它，故我们再补一次。
#
# 工具链：沿用 build.sh 里实际生效的那套（clang r383902 + gcc 4.9/androidkernel 前缀）。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          # 注意：Ubuntu 22.04 已移除 python2，不要安装它，否则 apt 直接失败
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex git gnupg gperf \
            libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils \
            lzop rsync zip zlib1g-dev python3 cpio
          echo "=== 关键工具确认 ==="
          for c in bc bison flex make gcc python3 zip; do
            printf "%-8s " "$c"; command -v $c || { echo MISSING; exit 1; }
          done

      - name: 拉取工具链
        run: |
          set -e
          # clang r383902（MGF 实测使用的版本）
          git clone --depth 1 -b clang-r383902 \
            https://github.com/makingrom/android_kernel_xiaomi_cezanne_general_gibrary_and_github_action \
            "$HOME/clang"
          # gcc 4.9 aarch64
          git clone --depth 1 -b aarch64-linux-android-4.9 \
            https://github.com/makingrom/android_kernel_xiaomi_cezanne_general_gibrary_and_github_action \
            "$HOME/gcc64"
          # gcc 4.9 arm32
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            "$HOME/gcc32"

          echo "CLANG_BIN=$HOME/clang/bin" >> $GITHUB_ENV
          echo "GCC64_BIN=$HOME/gcc64/bin" >> $GITHUB_ENV
          echo "GCC32_BIN=$HOME/gcc32/bin" >> $GITHUB_ENV

          "$HOME/clang/bin/clang" --version | head -2

          # 自动探测 CROSS_COMPILE 前缀：该 gcc 包里同时存在
          # aarch64-linux-android- 与 aarch64-linux-androidkernel- 两种前缀，
          # 与其写死不如按实际文件判断。
          if [ -x "$HOME/gcc64/bin/aarch64-linux-androidkernel-gcc" ]; then
            P64=aarch64-linux-androidkernel-
          elif [ -x "$HOME/gcc64/bin/aarch64-linux-android-gcc" ]; then
            P64=aarch64-linux-android-
          else
            echo "::error::找不到 aarch64 gcc"; exit 1
          fi
          if [ -x "$HOME/gcc32/bin/arm-linux-androideabi-gcc" ]; then
            P32=arm-linux-androideabi-
          elif [ -x "$HOME/gcc32/bin/arm-linux-gnueabi-gcc" ]; then
            P32=arm-linux-gnueabi-
          else
            echo "::error::找不到 arm32 gcc"; exit 1
          fi

          echo "探测结果 CROSS_COMPILE=$P64  CROSS_COMPILE_ARM32=$P32"
          echo "XCOMPILE64=$P64" >> $GITHUB_ENV
          echo "XCOMPILE32=$P32" >> $GITHUB_ENV

      - name: 克隆内核源码（MGF r 分支）
        run: |
          set -e
          git clone --depth 1 -b r \
            https://github.com/makingrom/android_kernel_xiaomi_cezanne.git kernel
          cd kernel
          echo "=== 源码版本 ==="
          head -5 Makefile
          echo "=== defconfig ==="
          ls -l arch/arm64/configs/cezanne_user_defconfig

      - name: 应用 LXC/Docker 容器配置
        run: |
          set -e
          cd kernel
          CFG=arch/arm64/configs/cezanne_user_defconfig

          echo "=== 下载官方容器配置脚本 ==="
          curl -sSL -o /tmp/lxc_open.sh \
            "https://raw.githubusercontent.com/makingrom/LXC-DOCKER-KernelSU_Action/main/Lxc_Docker/LXC-DOCKER-OPEN-CONFIG.sh"
          chmod +x /tmp/lxc_open.sh
          echo "脚本行数: $(wc -l < /tmp/lxc_open.sh)"

          echo "=== 应用前关键项 ==="
          grep -E "^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|NAMESPACES)=" "$CFG" || echo "(均未设置)"

          echo "=== 应用容器配置 ==="
          bash /tmp/lxc_open.sh "$CFG" -w

          echo "=== 补齐 SYSVIPC（该脚本清单未包含，但 IPC_NS 依赖它）==="
          # 同时补齐 MTK 调度依赖链，否则编译必炸：
          #   DEBUG_KERNEL=n -> SCHED_DEBUG=n -> MTK_SCHED_BOOST=n
          #     -> task_struct 无 cpu_prefer 字段
          #       -> task_turbo.c:59 (MTK_TASK_TURBO=y) 编译失败
          # 这是 MGF defconfig 自身的缺陷：开了 MTK_TASK_TURBO 却没满足其依赖。
          for opt in CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_NAMESPACES \
                     CONFIG_MULTIUSER CONFIG_DEVTMPFS \
                     CONFIG_DEBUG_KERNEL CONFIG_SCHED_DEBUG CONFIG_MTK_SCHED_BOOST; do
            if grep -q "^${opt}=" "$CFG"; then
              sed -i "s/^${opt}=.*/${opt}=y/" "$CFG"
            else
              echo "${opt}=y" >> "$CFG"
            fi
          done

          echo "=== 应用后关键项 ==="
          grep -E "^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|NAMESPACES|DEVTMPFS|OVERLAY_FS)=" "$CFG"

      - name: 生成 .config 并校验依赖
        run: |
          set -e
          cd kernel
          export PATH="$GCC64_BIN:$GCC32_BIN:$CLANG_BIN:$PATH"

          make ARCH=arm64 O=out cezanne_user_defconfig
          # olddefconfig 解析依赖链：验证 IPC_NS 在 SYSVIPC 开启后确实保留
          make ARCH=arm64 O=out olddefconfig

          echo "=== 依赖解析后的关键配置（决定性校验）==="
          for k in SYSVIPC POSIX_MQUEUE IPC_NS NAMESPACES PID_NS UTS_NS NET_NS DEVTMPFS OVERLAY_FS; do
            v=$(grep -E "^CONFIG_${k}=" out/.config || echo "# CONFIG_${k} is not set")
            echo "$v"
          done

          if ! grep -q "^CONFIG_IPC_NS=y" out/.config; then
            echo "::error::CONFIG_IPC_NS 未生效，容器无法启动"
            exit 1
          fi
          if ! grep -q "^CONFIG_SYSVIPC=y" out/.config; then
            echo "::error::CONFIG_SYSVIPC 未生效"
            exit 1
          fi
          echo "OK: IPC_NS + SYSVIPC 均生效"

      - name: 编译内核与模块
        run: |
          set -e
          cd kernel
          export PATH="$GCC64_BIN:$GCC32_BIN:$CLANG_BIN:$PATH"
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${XCOMPILE64}"
          export CROSS_COMPILE_ARM32="${XCOMPILE32}"

          # KCFLAGS="-w" 关闭所有警告。
          # 原因：本树 include/net/sock.h 与 include/net/route.h 硬编码了
          #   __attribute__((no_sanitize("null")))
          # clang r383902 不支持该属性，在 -Werror=attributes 下直接编译失败
          # （mm/memcontrol.o 首次触发）。makingrom 的 build.sh 同样使用
          # KCFLAGS="-w" 来构建此树，属该源码的既定做法。
          # 注意不要换成 -Wno-xxx 形式：clang 不认识的 GCC 专用警告名会被
          # CLANG_FLAGS += -Werror=unknown-warning-option 升级为错误，
          # 反而导致 cc-option 能力探测失败。
          set +e
          make -j$(nproc) O=out ARCH=arm64 KCFLAGS="-w" \
            CROSS_COMPILE="${XCOMPILE64}" \
            CROSS_COMPILE_ARM32="${XCOMPILE32}" \
            Image.gz-dtb > /tmp/build.log 2>&1
          RC=$?
          set -e

          tail -30 /tmp/build.log
          if [ $RC -ne 0 ]; then
            echo "======== 真实错误 ========"
            grep -nE "error:|fatal error:|Error [0-9]|\*\*\*" /tmp/build.log | head -40
            FIRST=$(grep -nE "error:|fatal error:" /tmp/build.log | head -1 | cut -d: -f1)
            if [ -n "$FIRST" ]; then
              S=$((FIRST>20 ? FIRST-20 : 1)); sed -n "${S},$((FIRST+10))p" /tmp/build.log
            fi
            echo "::error::内核编译失败 (exit $RC)"
            exit $RC
          fi

          echo "=== 产物 ==="
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: 编译并收集模块
        run: |
          set -e
          cd kernel
          export PATH="$GCC64_BIN:$GCC32_BIN:$CLANG_BIN:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${XCOMPILE64}"
          export CROSS_COMPILE_ARM32="${XCOMPILE32}"

          set +e
          make -j$(nproc) O=out ARCH=arm64 KCFLAGS="-w" \
            CROSS_COMPILE="${XCOMPILE64}" \
            CROSS_COMPILE_ARM32="${XCOMPILE32}" \
            modules > /tmp/modules.log 2>&1
          RC=$?
          set -e
          tail -15 /tmp/modules.log
          if [ $RC -ne 0 ]; then
            echo "::warning::modules 编译有错误，但内核已产出，继续"
            grep -nE "error:" /tmp/modules.log | head -10
          fi

          mkdir -p /tmp/out_modules
          find out -name "*.ko" -type f -exec cp {} /tmp/out_modules/ \; 2>/dev/null || true
          echo "=== 收集到的模块数: $(ls /tmp/out_modules 2>/dev/null | wc -l) ==="
          ls /tmp/out_modules 2>/dev/null | head -20

      - name: 校验产物（vermagic + IPC）
        run: |
          set -e
          cd kernel
          IMG=out/arch/arm64/boot/Image.gz-dtb

          echo "=== 解压检查 vermagic ==="
          gunzip -c "$IMG" > /tmp/Image.raw
          grep -a -o -m3 "4\.14\.186[-a-zA-Z0-9_.]* SMP[^\"]*" /tmp/Image.raw || true
          echo "--- linux_banner ---"
          grep -a -o -m1 "Linux version [0-9][^ ]*" /tmp/Image.raw

          echo "=== 从镜像本体提取 config，确认 IPC ==="
          if [ -f scripts/extract-ikconfig ]; then
            sh scripts/extract-ikconfig /tmp/Image.raw > /tmp/extracted.config 2>/dev/null || true
            grep -E "^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|NAMESPACES|DEVTMPFS)=" /tmp/extracted.config || echo "(提取失败，跳过)"
          fi

          echo "=== DTB 附加检查 ==="
          python3 - <<'PY'
          d=open('/tmp/Image.raw','rb').read()
          m=b'\xd0\x0d\xfe\xed'
          i=d.find(m)
          print('DTB 在解压镜像内:', i)
          g=open('out/arch/arm64/boot/Image.gz-dtb','rb').read()
          j=g.find(m)
          if j>0:
              t=int.from_bytes(g[j+4:j+8],'big')
              print(f'gz-dtb 文件内 DTB @ {j}, size={t}, 到末尾={j+t==len(g)}')
          else:
              print('gz-dtb 文件内无 DTB（纯 Image.gz）')
          PY

      - name: 上传内核与模块
        uses: actions/upload-artifact@v4
        with:
          name: cezanne-lxc-kernel
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 30

      - name: 上传模块
        uses: actions/upload-artifact@v4
        with:
          name: cezanne-lxc-modules
          path: /tmp/out_modules/
          if-no-files-found: warn
          retention-days: 30
